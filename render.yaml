# Render Blueprint for MagnoTrack IoT Monitoring System
# https://render.com/docs/blueprint-spec

databases:
  - name: magnotrack-db
    databaseName: magnotrack_db
    user: magnotrack_user
    plan: free
    region: oregon

services:
  - type: web
    name: magnotrack
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magnotrack-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: DEVICE_OFFLINE_THRESHOLD_SECONDS
        value: "30"
